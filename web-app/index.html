  <script>
    (function resetStaleLocalCache() {
      var local = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
      if (!local || !('serviceWorker' in navigator)) return;
      var resetKey = 'blueprint-local-cache-reset-v5';
      if (sessionStorage.getItem(resetKey)) return;
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(function (items) {
          return Promise.all(items.map(function (item) { return item.unregister(); }));
        }),
        'caches' in window ? caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (key) { return caches.delete(key); }));
        }) : Promise.resolve()
      ]).then(function () {
        sessionStorage.setItem(resetKey, '1');
        location.reload();
      });
    }());
  </script>

<script>
  window.addEventListener('error', function (event) {
    var view = document.getElementById('view');
    if (view) view.innerHTML = '<div class="error-note">Startup error: ' + String(event.message || 'unknown error').replace(/[<>&]/g, '') + '</div>';
  });
  window.addEventListener('unhandledrejection', function (event) {
    var view = document.getElementById('view');
    var reason = event.reason && event.reason.message ? event.reason.message : event.reason;
    if (view) view.innerHTML = '<div class="error-note">Startup error: ' + String(reason || 'unknown error').replace(/[<>&]/g, '') + '</div>';
  });
</script>
